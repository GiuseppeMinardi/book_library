[project]
name = "database-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
]

[dependency-groups]
dev = [
    "pgvector>=0.4.2",
    "psycopg-binary>=3.3.3",
    "psycopg2>=2.9.11",
    "pytest>=9.0.2",
    "pytest-mock>=3.10.0",
    "pytest-postgresql>=8.0.0",
    "testcontainers>=4.14.2",
]

[tool.uv.workspace]
members = [
    "src/database_api",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
