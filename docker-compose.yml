# ... (db section remains the same) ...
services:
  books_db:
    # Change this line from postgres:latest to the pgvector image
    image: pgvector/pgvector:pg16 
    container_name: books-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: appdb
    volumes:
      - bookdatabase:/var/lib/postgresql/data
      - ./src/database/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
  # 2. THE API
  db_api:
    build: ./src/database_api
    container_name: db-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@books_db:5432/appdb
    depends_on:
      - books_db
    # NEW: Map your local ./api folder to /app inside the container
    # For local development, map the source directory so code edits are reflected
    volumes:
      - ./src/database_api:/app
    # NEW: Use the --reload flag for Uvicorn/FastAPI
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  ollama:
    build: ./src/ollama_service
    container_name: ollama
    restart: always
    ports:
      - "11436:11434"
    volumes:
      - ollama_data:/root/.ollama

  agentic_filling_api:
    build: ./src/agentic_filling
    container_name: agentic_filling_api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - db_api_url=http://db_api:8000
      - ollama_url=http://ollama:11434
    depends_on:
      - books_db
      - db_api
      - ollama
    # NEW: Use the --reload flag for Uvicorn/FastAPI
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - .env
